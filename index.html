<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fais &amp; Wuri — Undangan Pernikahan</title>

<!-- Meta Tag untuk Preview WhatsApp -->
<meta property="og:title" content="Undangan Pernikahan Fais & Wuri">
<meta property="og:description" content="Kamis, 19 November 2026 — Kami mengundang Anda untuk hadir di hari bahagia kami.">
<meta property="og:image" content="1.jpg">
<meta property="og:url" content="https://wuricep291-rgb.github.io/W-F/">

<style>
  :root {
    --forest-dark: #142419;
    --gold: #C2A366;
    --gold-light: #E0CA98;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--forest-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  .invitation-container {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 900px;
    background: var(--forest-dark);
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .cover-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .design-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .guest-tag-overlay {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold-light);
    font-size: 0.85rem;
    text-align: center;
    width: 80%;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .open-btn {
    position: absolute; 
    bottom: 50px; 
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold); 
    color: var(--forest-dark);
    border: none; 
    padding: 12px 35px; 
    font-weight: bold;
    font-size: 0.85rem; 
    letter-spacing: 0.05em;
    border-radius: 25px; 
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
  }

  .open-btn:active {
    transform: translateX(-50%) scale(0.95);
  }
</style>
</head>
<body>

<div class="invitation-container">
  <div class="cover-wrapper">
    <!-- Gambar Cover di Canva (pastikan file gambarnya ada di GitHub) -->
    <img src="Brown and Beige Lace Floral Nikah Wedding Invitation.png" alt="Cover Undangan" class="design-img">
    
    <div class="guest-tag-overlay">
      <span>Kepada Yth.</span><br>
      <b id="guest-name-display" style="font-size: 1.05rem; color: #FFF;">Tamu Undangan</b>
    </div>

    <!-- Tombol untuk membuka link Canva -->
    <button class="open-btn" id="open-btn">BUKA UNDANGAN</button>
  </div>
</div>

<script>
  // 1. Ambil Nama Tamu dari URL (?to=Nama+Tamu)
  const urlParams = new URLSearchParams(window.location.search);
  const guestName = urlParams.get('to') || urlParams.get('nama');
  if(guestName) {
    const formattedName = decodeURIComponent(guestName.replace(/\+/g, ' '));
    document.getElementById('guest-name-display').textContent = formattedName;
  }

  // 2. Aksi ketika tombol "BUKA UNDANGAN" diklik
  const openBtn = document.getElementById('open-btn');
  openBtn.addEventListener('click', function(){
    // Link Website Canva milikmu
    const canvaWebsiteLink = "https://canva.link/bdn19gpcdgy2hld";
    
    window.location.href = canvaWebsiteLink;
  });
</script>

</body>
</html>
